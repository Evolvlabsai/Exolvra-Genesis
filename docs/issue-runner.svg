<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 600" font-family="ui-monospace, 'Cascadia Mono', Consolas, Menlo, monospace">
  <title>The issue runner: a maintainer labels a GitHub issue exolvra:ready; the runner proves its identity, claims the issue, snapshots and pins it, and runs the loop against the issue as the spec. Nothing checkable to build against becomes a triage comment naming what is missing; a win becomes a pushed branch and a pull request at exolvra:review for a human to merge; a block or budget stop becomes a draft PR stating what a human must decide.</title>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#97968f"/>
    </marker>
    <marker id="aw" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#4bbd85"/>
    </marker>
    <marker id="al" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#ef6a4f"/>
    </marker>
    <marker id="ay" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#e0a24a"/>
    </marker>
  </defs>

  <rect width="1560" height="600" fill="#131318"/>

  <!-- ===== top row: triage exit, and the human's decision ===== -->
  <rect x="596" y="64" width="250" height="70" rx="10" fill="#1d1d22" stroke="#e0a24a" stroke-width="1.5"/>
  <text x="721" y="94" text-anchor="middle" font-size="16" font-weight="600" fill="#e0a24a">exolvra:triage</text>
  <text x="721" y="115" text-anchor="middle" font-size="10.5" fill="#97968f">the comment names what is missing</text>

  <rect x="1286" y="64" width="210" height="70" rx="10" fill="#1d1d22" stroke="#4bbd85" stroke-width="1.5"/>
  <text x="1391" y="94" text-anchor="middle" font-size="16" font-weight="600" fill="#4bbd85">a human merges</text>
  <text x="1391" y="115" text-anchor="middle" font-size="10.5" fill="#97968f">the merge is never the tool's</text>

  <!-- triage path: up from snapshot/derive -->
  <path d="M801,264 V142" fill="none" stroke="#e0a24a" stroke-width="2" marker-end="url(#ay)"/>
  <text x="793" y="180" text-anchor="end" font-size="11" fill="#e0a24a">nothing checkable</text>
  <text x="793" y="196" text-anchor="end" font-size="11" fill="#e0a24a">to build against</text>

  <!-- triage return: the maintainer answers -->
  <path d="M596,99 H131 V256" fill="none" stroke="#97968f" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#a)"/>
  <text x="360" y="88" text-anchor="middle" font-size="11" fill="#97968f">a maintainer answers · re-adds ready</text>

  <!-- win path: PR up to the human -->
  <path d="M1288,264 V142" fill="none" stroke="#4bbd85" stroke-width="2" marker-end="url(#aw)"/>
  <text x="1300" y="180" font-size="11.5" fill="#4bbd85">exolvra:review</text>

  <!-- ===== main row ===== -->
  <rect x="36" y="264" width="190" height="72" rx="10" fill="#1d1d22" stroke="#2e2e35" stroke-width="1.5"/>
  <text x="131" y="295" text-anchor="middle" font-size="16" font-weight="600" fill="#e9e8e4">GitHub issue</text>
  <text x="131" y="317" text-anchor="middle" font-size="10.5" fill="#97968f">labelled exolvra:ready</text>

  <rect x="266" y="264" width="180" height="72" rx="10" fill="#1d1d22" stroke="#2e2e35" stroke-width="1.5"/>
  <text x="356" y="295" text-anchor="middle" font-size="16" font-weight="600" fill="#e9e8e4">identity</text>
  <text x="356" y="317" text-anchor="middle" font-size="10.5" fill="#97968f">who does GitHub say I am?</text>

  <rect x="486" y="264" width="180" height="72" rx="10" fill="#1d1d22" stroke="#2e2e35" stroke-width="1.5"/>
  <text x="576" y="295" text-anchor="middle" font-size="16" font-weight="600" fill="#e9e8e4">claim</text>
  <text x="576" y="317" text-anchor="middle" font-size="10.5" fill="#97968f">ready → working · heartbeat</text>

  <rect x="706" y="264" width="190" height="72" rx="10" fill="#1d1d22" stroke="#e0a24a" stroke-width="1.5"/>
  <text x="801" y="295" text-anchor="middle" font-size="16" font-weight="600" fill="#e9e8e4">snapshot · pin</text>
  <text x="801" y="317" text-anchor="middle" font-size="10.5" fill="#97968f">sha256 · edits block the run</text>

  <rect x="936" y="264" width="230" height="72" rx="10" fill="#1d1d22" stroke="#2e2e35" stroke-width="1.5"/>
  <text x="1051" y="292" text-anchor="middle" font-size="16" font-weight="600" fill="#e9e8e4">the loop</text>
  <text x="1051" y="311" text-anchor="middle" font-size="10.5" fill="#97968f">builders vs blind critics</text>
  <text x="1051" y="326" text-anchor="middle" font-size="10.5" fill="#97968f">the issue is the spec</text>

  <rect x="1196" y="264" width="185" height="72" rx="10" fill="#1d1d22" stroke="#4bbd85" stroke-width="1.5"/>
  <text x="1288" y="295" text-anchor="middle" font-size="16" font-weight="600" fill="#e9e8e4">pull request</text>
  <text x="1288" y="317" text-anchor="middle" font-size="10.5" fill="#97968f">branch pushed, never forced</text>

  <!-- main flow arrows -->
  <path d="M226,300 H258" fill="none" stroke="#97968f" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M446,300 H478" fill="none" stroke="#97968f" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M666,300 H698" fill="none" stroke="#97968f" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M896,300 H928" fill="none" stroke="#97968f" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M1166,300 H1188" fill="none" stroke="#4bbd85" stroke-width="2" marker-end="url(#aw)"/>

  <!-- identity refusal note -->
  <text x="356" y="360" text-anchor="middle" font-size="10.5" fill="#97968f">no name GitHub vouches for → exit 2</text>
  <text x="356" y="376" text-anchor="middle" font-size="10.5" fill="#97968f">nothing read, nothing written</text>

  <!-- ===== bottom row: the blocked exit ===== -->
  <rect x="906" y="470" width="290" height="72" rx="10" fill="#1d1d22" stroke="#ef6a4f" stroke-width="1.5"/>
  <text x="1051" y="501" text-anchor="middle" font-size="16" font-weight="600" fill="#ef6a4f">draft PR · exolvra:blocked</text>
  <text x="1051" y="523" text-anchor="middle" font-size="10.5" fill="#97968f">states what a human must decide</text>

  <path d="M1051,336 V462" fill="none" stroke="#ef6a4f" stroke-width="2" marker-end="url(#al)"/>
  <text x="1063" y="395" font-size="11" fill="#ef6a4f">blocked ·</text>
  <text x="1063" y="411" font-size="11" fill="#ef6a4f">budget-stopped</text>

  <!-- caption -->
  <text x="780" y="580" text-anchor="middle" font-size="11" fill="#97968f">one module owns GitHub · one owns git · force-push structurally absent · secrets render [redacted] everywhere</text>
</svg>
